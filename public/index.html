<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090b" />
<title>Nominees · Creative Awards</title>
<style>
  /* ---------- tokens ---------- */
  :root {
    --bg: #09090b;
    --panel: #131317;
    --panel-2: #17171c;
    --panel-3: #1d1d24;
    --line: #26262d;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --dim: #71717a;
    --accent: #ff6b2c;
    --accent-2: #ffb020;

    --radius: 12px;
    --radius-sm: 9px;

    /* 3D "pressed panel" shadows */
    --shadow-shell:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 -1px 0 rgba(0,0,0,.7) inset,
      0 7px 0 -3px #08080a,
      0 16px 26px -16px rgba(0,0,0,.95);
    --shadow-card:
      0 1px 0 rgba(255,255,255,.05) inset,
      0 -1px 0 rgba(0,0,0,.55) inset,
      0 4px 0 -2px #08080a,
      0 10px 18px -12px rgba(0,0,0,.9);
    --shadow-press:
      0 1px 0 rgba(255,255,255,.04) inset,
      0 2px 0 -2px #08080a,
      0 5px 10px -8px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;                       /* body locked, main scrolls */
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(120% 80% at 50% -10%, #1a1310 0%, transparent 60%),
      radial-gradient(90% 60% at 100% 110%, #101018 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .icon { width: 12px; height: 12px; flex: none; }
  .icon-sm { width: 11px; height: 11px; flex: none; }

  /* ---------- header ---------- */
  .app-header {
    flex: none;
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(9px + env(safe-area-inset-top)) 12px 9px;
    background: linear-gradient(180deg, #17171d, #0e0e12);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow-shell);
  }

  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .brand-mark {
    width: 28px; height: 28px;
    flex: none;
    display: grid; place-items: center;
    border-radius: 9px;
    font-size: 10px; font-weight: 800; letter-spacing: .4px;
    color: #140a02;
    background: linear-gradient(145deg, var(--accent-2), var(--accent));
    box-shadow:
      0 1px 0 rgba(255,255,255,.45) inset,
      0 -2px 0 rgba(0,0,0,.35) inset,
      0 4px 0 -2px #4a1c05,
      0 8px 14px -8px rgba(255,107,44,.8);
  }

  .brand-text { min-width: 0; }
  .brand-text h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -.2px;
    white-space: nowrap;
  }
  .brand-text p {
    margin: 1px 0 0;
    font-size: 10px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 46vw;
  }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 11px;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    color: #140a02;
    border: 1px solid #ff8a53;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 -2px 0 rgba(0,0,0,.3) inset,
      0 4px 0 -2px #4a1c05,
      0 9px 16px -10px rgba(255,107,44,.9);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    user-select: none;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active {
    transform: translateY(2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.25) inset,
      0 1px 0 -1px #4a1c05,
      0 4px 10px -8px rgba(255,107,44,.8);
  }
  .btn[disabled] { opacity: .65; pointer-events: none; }
  .btn.loading .icon { animation: spin .8s linear infinite; }

  .icon-btn {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    padding: 0;
    color: var(--muted);
    background: linear-gradient(180deg, #23232b, #181820);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 3px 0 -2px #08080a,
      0 6px 10px -8px rgba(0,0,0,.9);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, color .12s ease;
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn:active { transform: translateY(1px); box-shadow: var(--shadow-press); }
  .icon-btn.busy { color: var(--accent-2); pointer-events: none; }
  .icon-btn.busy .icon { animation: spin .8s linear infinite; }

  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  /* ---------- main scroll area ---------- */
  .app-main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 8px 10px 14px;
    box-shadow:
      inset 0 14px 22px -20px rgba(0,0,0,.95),
      inset 0 -14px 22px -20px rgba(0,0,0,.95);
  }
  .app-main::-webkit-scrollbar { width: 6px; }
  .app-main::-webkit-scrollbar-thumb {
    background: #2a2a33; border-radius: 999px;
  }

  .list { display: flex; flex-direction: column; gap: 6px; }

  /* ---------- nominee card ---------- */
  .card {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto 26px;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    background: linear-gradient(180deg, var(--panel-2), #101015);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
    transition: transform .14s ease, box-shadow .14s ease;
    animation: rise .28s ease both;
  }
  .card:active { transform: translateY(2px); box-shadow: var(--shadow-press); }

  .thumb {
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--panel-3);
    border: 1px solid #2c2c35;
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 3px 0 -2px #08080a,
      0 6px 10px -8px rgba(0,0,0,.9);
  }
  .thumb-fallback {
    display: grid; place-items: center;
    font-size: 15px; font-weight: 800;
    color: var(--accent-2);
    background: linear-gradient(145deg, #2a1c12, #141018);
  }

  .info { min-width: 0; }
  .name {
    margin: 0;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: -.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .uid {
    margin: 1px 0 0;
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .metrics {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 6px;
    font-size: 9.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: #fff;
    background: rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .badge-votes .icon-sm { color: var(--accent-2); }
  .badge-followers .icon-sm { color: #7dd3fc; }
  .badge-votes.flash { animation: flash 1s ease-out; }

  /* ---------- states: skeleton / error / empty ---------- */
  .sk {
    background: linear-gradient(90deg, #17171c 25%, #22222b 37%, #17171c 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 6px;
  }
  .sk.thumb-sk { width: 44px; height: 44px; border-radius: 8px; }
  .sk-lines { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .sk.l1 { height: 10px; width: 65%; }
  .sk.l2 { height: 8px;  width: 40%; }
  .sk.b1 { height: 14px; width: 54px; border-radius: 999px; }
  .sk.b2 { height: 26px; width: 26px; border-radius: 8px; justify-self: end; }

  .card.skeleton { animation: none; }

  .state {
    display: grid;
    place-items: center;
    gap: 10px;
    padding: 34px 18px;
    text-align: center;
    color: var(--muted);
    font-size: 11.5px;
    border-radius: var(--radius);
    background: linear-gradient(180deg, var(--panel-2), #101015);
    border: 1px dashed var(--line);
    box-shadow: var(--shadow-card);
  }
  .state strong { color: var(--text); font-size: 12.5px; display: block; }
  .state .btn { margin-top: 2px; }

  /* ---------- footer ---------- */
  .app-footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 7px 12px calc(7px + env(safe-area-inset-bottom));
    font-size: 10px;
    font-weight: 600;
    color: var(--dim);
    background: linear-gradient(0deg, #17171d, #0e0e12);
    border-top: 1px solid var(--line);
    box-shadow:
      0 1px 0 rgba(255,255,255,.05) inset,
      0 -7px 0 -3px #08080a,
      0 -16px 26px -18px rgba(0,0,0,.95);
    white-space: nowrap;
    overflow: hidden;
  }
  .app-footer .dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: #3a3a44;
    flex: none;
  }
  .app-footer b { color: var(--text); font-weight: 700; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(46px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    z-index: 20;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: #1b1b22;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-card);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- animations ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes shimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes flash {
    0%   { box-shadow: 0 0 0 2px rgba(255,176,32,.75), 0 0 14px rgba(255,176,32,.55); }
    100% { box-shadow: 0 0 0 0 rgba(255,176,32,0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">CA</div>
      <div class="brand-text">
        <h1>Nominees</h1>
        <p id="status">Connecting…</p>
      </div>
    </div>
    <button id="refreshAll" class="btn" type="button" aria-label="Refresh all nominees">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
      <span>Refresh</span>
    </button>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="app-main" id="main">
    <div class="list" id="list" aria-live="polite" aria-busy="true"></div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="app-footer">
    <span id="statCount">— nominees</span>
    <span class="dot"></span>
    <span id="statVotes">— votes</span>
    <span class="dot"></span>
    <span id="statUpdated">—</span>
  </footer>

  <div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------------
     Config
  --------------------------------------------------------------- */
  const API = '/api/nominees';
  const SKELETON_COUNT = 7;

  /* ---------------------------------------------------------------
     DOM refs
  --------------------------------------------------------------- */
  const $list       = document.getElementById('list');
  const $status     = document.getElementById('status');
  const $refreshAll = document.getElementById('refreshAll');
  const $statCount  = document.getElementById('statCount');
  const $statVotes  = document.getElementById('statVotes');
  const $statUpd    = document.getElementById('statUpdated');
  const $toast      = document.getElementById('toast');

  /* ---------------------------------------------------------------
     Icons (inline, tiny)
  --------------------------------------------------------------- */
  const ICON = {
    chart: `<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/>
              <path d="M13 17V5"/><path d="M8 17v-3"/></svg>`,
    users: `<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
    refresh: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/></svg>`,
  };

  /* ---------------------------------------------------------------
     State
  --------------------------------------------------------------- */
  const state = {
    nominees: [],
    loading: false,
    lastUpdated: null,
  };

  /* ---------------------------------------------------------------
     Helpers
  --------------------------------------------------------------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const fmtNum = (n) =>
    typeof n === 'number' && Number.isFinite(n) ? n.toLocaleString('en-US') : '—';

  function fmtVotes(n) {
    if (typeof n.votes === 'number') return n.votes.toLocaleString('en-US');
    if (n.votesRaw) {
      const t = String(n.votesRaw).replace(/votes?/i, '').trim();
      return t || '—';
    }
    return '—';
  }

  function timeStr(d = new Date()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  let toastTimer;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 2200);
  }

  /* ---------------------------------------------------------------
     Fetch
  --------------------------------------------------------------- */
  async function fetchNominees() {
    const res = await fetch(`${API}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    const json = await res.json();
    if (json && json.error) throw new Error(json.error);
    return Array.isArray(json?.nominees) ? json.nominees : [];
  }

  /* ---------------------------------------------------------------
     Templates
  --------------------------------------------------------------- */
  function skeletonHTML() {
    return `
      <div class="card skeleton" aria-hidden="true">
        <div class="sk thumb-sk"></div>
        <div class="sk-lines"><div class="sk l1"></div><div class="sk l2"></div></div>
        <div class="metrics">
          <div class="sk b1"></div>
          <div class="sk b1" style="width:44px"></div>
        </div>
        <div class="sk b2"></div>
      </div>`;
  }

  function renderSkeleton() {
    $list.setAttribute('aria-busy', 'true');
    $list.innerHTML = Array.from({ length: SKELETON_COUNT }, skeletonHTML).join('');
  }

  function cardHTML(n) {
    const name    = esc(n.name || 'Unknown');
    const id      = esc(n.id || '');
    const initial = esc((n.name || '?').trim().charAt(0).toUpperCase() || '?');
    const img     = n.image
      ? `<img class="thumb" src="${esc(n.image)}" alt="${name}" loading="lazy" decoding="async">`
      : `<div class="thumb thumb-fallback">${initial}</div>`;

    return `
      <article class="card" data-id="${id}">
        ${img}
        <div class="info">
          <p class="name" title="${name}">${name}</p>
          <p class="uid" title="${id}">${id}</p>
        </div>
        <div class="metrics">
          <span class="badge badge-votes" title="Votes">
            ${ICON.chart}<span class="votes-val">${esc(fmtVotes(n))}</span>
          </span>
          <span class="badge badge-followers" title="Followers">
            ${ICON.users}<span class="followers-val">${esc(n.followers || '—')}</span>
          </span>
        </div>
        <button class="icon-btn refresh-one" type="button" data-id="${id}"
                aria-label="Refresh votes for ${name}">${ICON.refresh}</button>
      </article>`;
  }

  function stateHTML(kind, message) {
    const isError = kind === 'error';
    return `
      <div class="state">
        <strong>${isError ? 'Could not load nominees' : 'No nominees found'}</strong>
        <span>${esc(message || (isError ? 'Something went wrong.' : 'The grid appears to be empty.'))}</span>
        <button class="btn" type="button" id="retryBtn">
          ${ICON.refresh}<span>${isError ? 'Retry' : 'Reload'}</span>
        </button>
      </div>`;
  }

  /* ---------------------------------------------------------------
     Render
  --------------------------------------------------------------- */
  function attachImgFallbacks() {
    $list.querySelectorAll('img.thumb').forEach((img) => {
      img.addEventListener('error', () => {
        const d = document.createElement('div');
        d.className = 'thumb thumb-fallback';
        d.textContent = (img.alt || '?').trim().charAt(0).toUpperCase() || '?';
        img.replaceWith(d);
      }, { once: true });
    });
  }

  function renderList() {
    if (!state.nominees.length) {
      $list.setAttribute('aria-busy', 'false');
      $list.innerHTML = stateHTML('empty');
      return;
    }
    $list.setAttribute('aria-busy', 'false');
    $list.innerHTML = state.nominees.map(cardHTML).join('');
    attachImgFallbacks();
  }

  function renderError(msg) {
    $list.setAttribute('aria-busy', 'false');
    $list.innerHTML = stateHTML('error', msg);
  }

  function updateStats() {
    const count = state.nominees.length;
    const totalVotes = state.nominees.reduce(
      (sum, n) => sum + (typeof n.votes === 'number' ? n.votes : 0), 0
    );
    $statCount.innerHTML = `<b>${fmtNum(count)}</b> nominee${count === 1 ? '' : 's'}`;
    $statVotes.innerHTML = `<b>${fmtNum(totalVotes)}</b> votes`;
    $statUpd.innerHTML = state.lastUpdated
      ? `updated <b>${timeStr(state.lastUpdated)}</b>`
      : '—';
  }

  /* ---------------------------------------------------------------
     Actions
  --------------------------------------------------------------- */
  async function loadAll() {
    if (state.loading) return;
    state.loading = true;

    $refreshAll.classList.add('loading');
    $refreshAll.disabled = true;
    $status.textContent = 'Loading…';

    if (!state.nominees.length) renderSkeleton();

    try {
      const data = await fetchNominees();
      state.nominees = data;
      state.lastUpdated = new Date();
      renderList();
      updateStats();
      $status.textContent = data.length
        ? `${data.length} nominees · ${timeStr(state.lastUpdated)}`
        : 'No nominees found';
    } catch (err) {
      renderError(err.message);
      $status.textContent = 'Failed to load';
      toast('Failed to load nominees');
    } finally {
      state.loading = false;
      $refreshAll.classList.remove('loading');
      $refreshAll.disabled = false;
    }
  }

  async function refreshOne(btn) {
    const id = btn.dataset.id;
    if (!id || btn.classList.contains('busy')) return;

    const card = btn.closest('.card');
    btn.classList.add('busy');

    try {
      const fresh = await fetchNominees();
      const updated = fresh.find((x) => x.id === id);
      if (!updated) {
        toast('Nominee not found anymore');
        return;
      }

      // Patch local state
      const idx = state.nominees.findIndex((x) => x.id === id);
      if (idx > -1) state.nominees[idx] = updated;

      // Patch DOM
      if (card) {
        const votesEl = card.querySelector('.votes-val');
        const folEl   = card.querySelector('.followers-val');
        const badge   = card.querySelector('.badge-votes');

        if (votesEl) votesEl.textContent = fmtVotes(updated);
        if (folEl)   folEl.textContent   = updated.followers || '—';

        if (badge) {
          badge.classList.remove('flash');
          void badge.offsetWidth;   // restart animation
          badge.classList.add('flash');
        }
      }

      state.lastUpdated = new Date();
      updateStats();
      $status.textContent = `${state.nominees.length} nominees · ${timeStr(state.lastUpdated)}`;
    } catch (err) {
      toast(err.message || 'Refresh failed');
    } finally {
      btn.classList.remove('busy');
    }
  }

  /* ---------------------------------------------------------------
     Event wiring (delegation)
  --------------------------------------------------------------- */
  $refreshAll.addEventListener('click', loadAll);

  $list.addEventListener('click', (e) => {
    const refreshBtn = e.target.closest('.refresh-one');
    if (refreshBtn) {
      e.preventDefault();
      refreshOne(refreshBtn);
      return;
    }
    if (e.target.closest('#retryBtn')) {
      e.preventDefault();
      state.nominees = [];
      loadAll();
    }
  });

  // Refresh when tab becomes visible again (after 60s of being hidden)
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = Date.now();
    } else if (hiddenAt && Date.now() - hiddenAt > 60_000) {
      loadAll();
    }
  });

  /* ---------------------------------------------------------------
     Boot
  --------------------------------------------------------------- */
  renderSkeleton();
  loadAll();
})();
</script>
</body>
</html>
